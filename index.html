<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1"/>
  <title>場地借用管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
  <!-- ★ 引入 FullCalendar 套件 -->
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    .input-field { width: 100%; border-radius: 0.5rem; border: 1px solid #e2e8f0; padding: 0.6rem; font-size: 0.875rem; transition: all 0.2s; } 
    .input-field:focus { border-color: #6366f1; outline: 2px solid #e0e7ff; } 
    .disabled-input { background-color: #f3f4f6; color: #9ca3af; pointer-events: none; }
    aside.absolute { bottom: 0; }
    
    /* 紅色呼吸燈動畫 (用於強調缺件按鈕) */
    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.4); }
      70% { box-shadow: 0 0 0 6px rgba(225, 29, 72, 0); }
      100% { box-shadow: 0 0 0 0 rgba(225, 29, 72, 0); }
    }
    .btn-alert { animation: pulse-red 2s infinite; }

    /* === 日曆 Modal 專用 CSS === */
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 15px 0; }
    .day-btn { padding: 8px; border: 1px solid #e2e8f0; background: white; cursor: pointer; text-align: center; border-radius: 6px; font-size: 14px; user-select: none; }
    .day-btn:hover { background-color: #f1f5f9; }
    .day-btn.active { background: #3b82f6; color: white; font-weight: bold; border-color: #2563eb; }
    .day-btn.active:hover { background-color: #2563eb; }
    .holiday-red { color: #dc2626; background-color: #fef2f2; border-color: #fee2e2; }
    .holiday-red.active { background: #dc2626; color: white; border-color: #b91c1c; }
    .weekend { background-color: #f8fafc; color: #64748b; }

    /* ★ 覆寫 FullCalendar 的樣式讓它配 Tailwind */
    .fc-event { cursor: pointer; padding: 2px 4px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); border-radius: 4px; }
    .fc-theme-standard th { border-color: #e2e8f0; padding: 6px 0; font-weight: 600; font-size: 13px; color: #475569; }
    .fc-theme-standard td, .fc-theme-standard th { border-color: #f1f5f9; }
    .fc .fc-toolbar-title { font-size: 1.1rem !important; font-weight: bold; color: #4f46e5; }
    .fc .fc-button-primary { background-color: #f1f5f9 !important; border: 1px solid #e2e8f0 !important; color: #475569 !important; padding: 0.3rem 0.6rem !important; font-size: 13px !important; text-transform: capitalize; }
    .fc .fc-button-primary:hover, .fc .fc-button-primary:active, .fc .fc-button-active { background-color: #4f46e5 !important; color: white !important; border-color: #4f46e5 !important; }
    .fc-list-event:hover td { background-color: #f8fafc !important; }
    
    /* 讓 "+X 更多" 按鈕更明顯，並且點開的 Popover 樣式更漂亮 */
    .fc-daygrid-more-link { font-weight: bold; color: #3b82f6 !important; font-size: 0.75rem; padding-left: 4px; }
    .fc-popover { border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); border: 1px solid #e2e8f0; z-index: 50; }
    .fc-popover-header { background-color: #f8fafc; border-bottom: 1px solid #e2e8f0; padding: 8px 12px; font-weight: bold; color: #334155; border-radius: 12px 12px 0 0; }
    
    /* ★ 毛玻璃 Loading 遮罩動畫 */
    .loading-overlay { position: absolute; inset: 0; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(2px); z-index: 40; display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; border-radius: inherit; }
    .loading-overlay.active { opacity: 1; pointer-events: all; }
    .spinner { width: 32px; height: 32px; border: 3px solid #e2e8f0; border-top-color: #4f46e5; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* ================= 🔥 週課程輪播展示 (消防風格) ================= */
    .sc-launch { position: relative; width: 100%; margin-top: 10px; padding: 12px 16px; border: none; border-radius: 12px; cursor: pointer; overflow: hidden;
      background: linear-gradient(120deg, #7f1d1d 0%, #ea580c 45%, #f59e0b 100%); color: #fff; font-weight: 800; letter-spacing: .05em;
      box-shadow: 0 8px 20px -6px rgba(234, 88, 12, .55); transition: transform .2s ease, box-shadow .2s ease; }
    .sc-launch:hover { transform: translateY(-2px); box-shadow: 0 12px 26px -6px rgba(234, 88, 12, .75); }
    .sc-launch:active { transform: translateY(0); }
    .sc-launch::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 4px;
      background: repeating-linear-gradient(45deg, #fde047 0 10px, #7f1d1d 10px 20px); opacity: .9; }
    .sc-launch .sc-launch-sub { display: block; font-weight: 500; font-size: 11px; opacity: .9; letter-spacing: .02em; margin-top: 2px; }

    #showcaseOverlay { position: fixed; inset: 0; z-index: 5000; display: none; flex-direction: column; overflow: hidden;
      background: #08090c; color: #f1f5f9; font-family: 'Inter', 'Noto Sans TC', sans-serif; }
    #showcaseOverlay.sc-open { display: flex; }
    #showcaseOverlay::before { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(125% 85% at 50% 118%, rgba(255,106,19,.55) 0%, rgba(255,45,26,.20) 34%, rgba(8,9,12,0) 68%);
      animation: sc-breathe 6s ease-in-out infinite; }
    @keyframes sc-breathe { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }

    /* 底部火焰 */
    .sc-flames { position: absolute; left: 0; right: 0; bottom: 0; height: 28vh; z-index: 1; pointer-events: none; filter: blur(22px); }
    .sc-flames span { position: absolute; bottom: -8vh; width: 26vw; height: 30vh; border-radius: 50% 50% 40% 40%;
      background: linear-gradient(to top, #ff2d1a 0%, #ff6a13 45%, rgba(255,183,3,0) 88%); animation: sc-flicker 3.4s ease-in-out infinite; }
    .sc-flames span:nth-child(1) { left: 2%;  animation-delay: 0s;    opacity: .55; }
    .sc-flames span:nth-child(2) { left: 24%; animation-delay: -.9s;  opacity: .45; }
    .sc-flames span:nth-child(3) { left: 48%; animation-delay: -1.7s; opacity: .55; }
    .sc-flames span:nth-child(4) { left: 70%; animation-delay: -2.4s; opacity: .42; }
    .sc-flames span:nth-child(5) { left: 86%; animation-delay: -1.2s; opacity: .5; }
    @keyframes sc-flicker {
      0%, 100% { transform: translateY(0) scale(1, 1); }
      25%      { transform: translateY(-2.5vh) scale(.92, 1.16); }
      50%      { transform: translateY(-1vh) scale(1.08, .94); }
      75%      { transform: translateY(-3.5vh) scale(.96, 1.10); } }

    /* 頁首 */
    .sc-header { position: relative; z-index: 3; flex: none; display: flex; align-items: center; gap: 1.6vw; padding: 1.8vh 2.2vw 1.2vh; }
    .sc-brand { display: flex; align-items: center; gap: .7vw; font-weight: 900; letter-spacing: .06em; font-size: clamp(19px, 2vw, 40px); white-space: nowrap; }
    .sc-brand .sc-fire { color: #ff6a13; filter: drop-shadow(0 0 14px rgba(255,106,19,.85)); animation: sc-pulse 1.7s ease-in-out infinite; }
    @keyframes sc-pulse { 0%, 100% { transform: scale(1); opacity: .88; } 50% { transform: scale(1.14); opacity: 1; } }
    .sc-siren { flex: none; width: 12px; height: 12px; border-radius: 50%; background: #ff2d1a; animation: sc-siren 1.5s infinite; }
    @keyframes sc-siren { 0% { box-shadow: 0 0 0 0 rgba(255,45,26,.75); } 70% { box-shadow: 0 0 0 18px rgba(255,45,26,0); } 100% { box-shadow: 0 0 0 0 rgba(255,45,26,0); } }
    .sc-range { font-size: clamp(13px, 1.15vw, 22px); color: #fbbf24; font-weight: 700; letter-spacing: .08em; white-space: nowrap; }
    .sc-clock { margin-left: auto; display: flex; align-items: baseline; gap: .7vw; white-space: nowrap; }
    .sc-clock-t { font-size: clamp(20px, 2.1vw, 42px); font-weight: 800; color: #fff; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
    .sc-clock-d { font-size: clamp(12px, 1.05vw, 20px); color: #94a3b8; }
    .sc-hazard { position: relative; z-index: 3; flex: none; height: 9px;
      background: repeating-linear-gradient(45deg, #f59e0b 0 18px, #16181d 18px 36px); box-shadow: 0 0 26px rgba(245,158,11,.35); }

    /* 舞台 */
    .sc-stage { position: relative; z-index: 3; flex: 1; min-height: 0; display: flex; padding: 2.2vh 2.2vw 1vh; }
    .sc-slide { flex: 1; min-height: 0; display: flex; flex-direction: column; animation: sc-in .5s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes sc-in { from { opacity: 0; transform: translateY(26px) scale(.99); } to { opacity: 1; transform: none; } }

    /* 單日課表 */
    .sc-day-head { flex: none; display: flex; align-items: baseline; gap: 1.2vw; margin-bottom: 1.6vh; }
    .sc-dow { font-size: clamp(26px, 3.2vw, 62px); font-weight: 900; color: #fbbf24; text-shadow: 0 0 26px rgba(251,191,36,.35); line-height: 1; }
    .sc-date { font-size: clamp(15px, 1.45vw, 28px); color: #94a3b8; letter-spacing: .1em; }
    .sc-today { font-size: clamp(12px, 1vw, 20px); font-weight: 800; color: #08090c; background: #fbbf24; padding: .3vh .8vw; border-radius: 999px; letter-spacing: .1em; }
    .sc-count { margin-left: auto; font-size: clamp(12px, 1.1vw, 21px); font-weight: 700; color: #fb923c;
      border: 1px solid rgba(251,146,60,.45); background: rgba(251,146,60,.10); padding: .5vh 1.1vw; border-radius: 999px; white-space: nowrap; }
    .sc-cards { flex: 1; min-height: 0; display: grid; gap: 1.4vh 1.4vw; grid-template-columns: repeat(2, minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
    .sc-cards.sc-one { grid-template-columns: minmax(0, 1fr); align-content: center; grid-auto-rows: minmax(0, 30vh); }
    .sc-card { display: flex; align-items: stretch; gap: 1.3vw; padding: 1.8vh 1.5vw; border-radius: 16px; min-width: 0;
      background: linear-gradient(125deg, rgba(32,36,44,.94), rgba(16,18,23,.94)); border: 1px solid rgba(255,255,255,.07); border-left: 7px solid #ff6a13;
      box-shadow: 0 14px 34px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.05); }
    .sc-card.sc-room { border-left-color: #fbbf24; }
    .sc-card.sc-field { border-left-color: #ff2d1a; }
    .sc-time { flex: none; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: .5vh; padding-right: 1.2vw; border-right: 1px dashed rgba(255,255,255,.14); }
    .sc-t { font-size: clamp(17px, 1.7vw, 34px); font-weight: 800; font-variant-numeric: tabular-nums; color: #fff; line-height: 1; }
    .sc-t.sc-t-end { color: #94a3b8; font-size: clamp(14px, 1.3vw, 26px); }
    .sc-tbar { width: 100%; height: 2px; background: linear-gradient(90deg, #ff6a13, rgba(255,106,19,0)); }
    .sc-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
    .sc-topic { font-size: clamp(19px, 1.85vw, 38px); font-weight: 800; line-height: 1.28; color: #fff;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sc-meta { display: flex; flex-wrap: wrap; gap: .5vw .6vw; margin-top: 1vh; }
    .sc-chip { display: inline-flex; align-items: center; gap: .35vw; font-size: clamp(12px, 1.05vw, 21px); color: #cbd5e1;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.10); padding: .35vh .8vw; border-radius: 999px; }
    .sc-chip i { color: #fb923c; }

    /* 一週總覽 */
    .sc-week { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: .7vw; }
    .sc-col { display: flex; flex-direction: column; min-height: 0; border-radius: 12px; overflow: hidden;
      background: rgba(255,255,255,.035); border: 1px solid rgba(255,255,255,.07); }
    .sc-col.sc-col-today { border-color: rgba(251,191,36,.6); box-shadow: 0 0 0 2px rgba(251,191,36,.16); }
    .sc-col-h { flex: none; padding: 1vh .5vw; text-align: center; border-bottom: 1px solid rgba(255,255,255,.08);
      background: linear-gradient(180deg, rgba(255,106,19,.22), rgba(255,106,19,.04)); }
    .sc-col.sc-col-today .sc-col-h { background: linear-gradient(180deg, rgba(251,191,36,.30), rgba(251,191,36,.06)); }
    .sc-col-dow { font-size: clamp(13px, 1.15vw, 23px); font-weight: 800; color: #fff; }
    .sc-col-date { font-size: clamp(10px, .85vw, 16px); color: #94a3b8; font-variant-numeric: tabular-nums; }
    .sc-col-b { flex: 1; min-height: 0; padding: .7vh .5vw; display: flex; flex-direction: column; gap: .6vh; overflow: hidden; }
    .sc-mini { border-radius: 8px; padding: .6vh .6vw; background: rgba(0,0,0,.38); border-left: 3px solid #ff6a13; min-width: 0; }
    .sc-mini.sc-room { border-left-color: #fbbf24; }
    .sc-mini.sc-field { border-left-color: #ff2d1a; }
    .sc-mini-t { font-size: clamp(9px, .8vw, 15px); color: #fb923c; font-weight: 700; font-variant-numeric: tabular-nums; }
    .sc-mini-x { font-size: clamp(10px, .92vw, 17px); color: #f1f5f9; font-weight: 600; line-height: 1.3;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sc-mini-f { font-size: clamp(9px, .78vw, 14px); color: #94a3b8; }
    .sc-more { font-size: clamp(9px, .8vw, 15px); color: #fbbf24; font-weight: 700; text-align: center; }
    .sc-rest { margin: auto; font-size: clamp(10px, .85vw, 16px); color: #475569; }

    /* 空狀態 */
    .sc-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2vh; text-align: center; }
    .sc-empty i { font-size: clamp(48px, 6vw, 110px); color: #ff6a13; filter: drop-shadow(0 0 24px rgba(255,106,19,.6)); }
    .sc-empty-t { font-size: clamp(20px, 2.2vw, 42px); font-weight: 800; }
    .sc-empty-s { font-size: clamp(13px, 1.2vw, 22px); color: #94a3b8; }

    /* 頁尾控制列 */
    .sc-footer { position: relative; z-index: 3; flex: none; display: flex; align-items: center; gap: 1.2vw; padding: 1.2vh 2.2vw 2.2vh; }
    .sc-dots { display: flex; flex-wrap: wrap; gap: .45vw; }
    .sc-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.18); transition: all .3s ease; cursor: pointer; }
    .sc-dot.sc-on { background: #ff6a13; box-shadow: 0 0 14px rgba(255,106,19,.9); transform: scale(1.3); }
    .sc-ctrls { margin-left: auto; display: flex; align-items: center; gap: .6vw; }
    .sc-btn { display: inline-flex; align-items: center; gap: .35vw; font-size: clamp(12px, 1vw, 19px); font-weight: 700; color: #e2e8f0; cursor: pointer;
      background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12); border-radius: 10px; padding: .7vh 1vw; transition: all .2s ease; white-space: nowrap; }
    .sc-btn:hover { background: rgba(255,106,19,.20); border-color: rgba(255,106,19,.55); color: #fff; }
    .sc-btn.sc-exit { background: rgba(255,45,26,.16); border-color: rgba(255,45,26,.5); color: #fca5a5; }
    .sc-btn.sc-exit:hover { background: #ff2d1a; color: #fff; }
    .sc-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(255,255,255,.07); }
    .sc-progress span { display: block; height: 100%; width: 0;
      background: linear-gradient(90deg, #fbbf24, #ff6a13 55%, #ff2d1a); box-shadow: 0 0 18px rgba(255,106,19,.85); }

    @media (max-width: 900px) {
      .sc-cards { grid-template-columns: minmax(0, 1fr); }
      .sc-week { grid-template-columns: repeat(2, minmax(0, 1fr)); overflow-y: auto; }
      .sc-clock-t { font-size: 18px; }
      .sc-brand { font-size: 16px; }
      .sc-range { display: none; }
      .sc-btn span { display: none; }
    }

  </style>

  <script>
    // ⚠️ 系統切換連結區
    const TRAINING_FLOW_URL = "https://tfd-train.github.io/Training-Flow-Management/";
    const PORTAL_URL = "https://tfd-train.github.io/Training-Management-Platform/"; 
    const EV_SYSTEM_URL = "https://tfd-train.github.io/Electric-Vehicle/";
  </script>
</head>
<body class="bg-slate-100 text-slate-800 h-screen overflow-hidden flex selection:bg-indigo-500 selection:text-white">

  <!-- Sidebar -->
  <aside class="w-64 bg-slate-900 text-white hidden md:flex flex-col shadow-2xl z-30 transition-all duration-300">
    <div class="p-6 border-b border-slate-800 flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/50">
        <i class="ri-building-2-fill text-white"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg tracking-wide">場地預約</h1>
        <p class="text-xs text-slate-400">訓練中心內部系統</p>
      </div>
    </div>
    
    <nav class="flex-1 p-4 space-y-2 overflow-y-auto">
      <button onclick="switchView('form'); resetForm();" class="nav-btn w-full text-left px-4 py-3 rounded-xl bg-indigo-600/20 text-indigo-300 border border-indigo-500/30 flex items-center gap-3 hover:bg-indigo-600 hover:text-white transition">
        <i class="ri-add-circle-line text-xl"></i> 新增申請
      </button>
      <button onclick="switchView('list')" class="nav-btn w-full text-left px-4 py-3 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white flex items-center justify-between transition group">
        <div class="flex items-center gap-3"><i class="ri-file-list-3-line text-xl"></i> 預約清單</div>
        <!-- 🔴 Sidebar Badge -->
        <span id="pendingBadge" class="hidden bg-rose-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-full shadow-sm group-hover:bg-white group-hover:text-rose-600">0</span>
      </button>
      <button id="exportCsvBtn" class="w-full text-left px-4 py-2.5 rounded-xl text-slate-400 hover:bg-slate-800 hover:text-white flex items-center gap-3 transition text-sm mt-4">
        <i class="ri-file-excel-line"></i> 匯出報表
      </button>
    </nav>

    <div class="p-4 border-t border-slate-800 space-y-2 bg-slate-900">
        <div class="text-[10px] text-slate-500 font-bold px-4 mb-1 uppercase tracking-wider">系統切換</div>

        </a>
        <a href="javascript:void(0)" onclick="location.href=EV_SYSTEM_URL" class="flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition text-sm">
            <i class="ri-charging-pile-2-fill text-lg text-emerald-400"></i> 電動車訓練統計
        </a>
        <a href="javascript:void(0)" onclick="location.href=PORTAL_URL" class="flex items-center gap-3 px-4 py-2 rounded-xl text-slate-500 hover:text-white transition text-xs">
            <i class="ri-arrow-left-line"></i> 回整合首頁
        </a>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 flex flex-col h-full overflow-hidden relative bg-slate-100">
    <header class="md:hidden bg-white p-4 shadow-sm flex justify-between items-center z-20">
      <h1 class="font-bold text-slate-800 flex items-center gap-2">
        <i class="ri-building-2-fill text-indigo-600"></i> 場地預約
      </h1>
      <div class="flex gap-4 items-center">
        <a href="javascript:void(0)" onclick="location.href=PORTAL_URL" class="text-slate-400 hover:text-indigo-600"><i class="ri-home-4-line text-xl"></i></a>
        <button onclick="toggleMobileSidebar()" class="text-slate-600 p-2"><i class="ri-menu-line text-xl"></i></button>
      </div>
    </header>

    <div class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6 scroll-smooth">
      
      <!-- View: Form -->
      <div id="view-form" class="max-w-7xl mx-auto animate-fade-in grid lg:grid-cols-3 gap-6 relative">
        <div class="lg:col-span-2 space-y-6">
            
            <!-- 🔴 待補照片提醒區塊 -->
            <div id="todoSection" class="hidden bg-rose-50 border border-rose-100 rounded-2xl p-5 shadow-sm relative overflow-hidden">
                <div class="absolute right-0 top-0 w-24 h-24 bg-rose-100 rounded-full -mr-8 -mt-8 opacity-50"></div>

  <div id="showcaseOverlay" aria-hidden="true">

        <button class="sc-btn" id="scPrev" title="上一頁 (←)"><i class="ri-arrow-left-s-line"></i></button>
        <button class="sc-btn" id="scPlay" title="暫停/播放 (空白鍵)"><i class="ri-pause-fill" id="scPlayIcon"></i><span id="scPlayText">暫停</span></button>
        <button class="sc-btn" id="scNext" title="下一頁 (→)"><i class="ri-arrow-right-s-line"></i></button>
        <button class="sc-btn" id="scNextWeek" title="下一週"><i class="ri-speed-mini-fill"></i><span>下一週</span></button>

      </div>

<script>
  // ==================== 全域設定 ====================
  const $ = (s) => document.querySelector(s);
  let dbData =[];
  let calendar; 

  // ⚠️ ★ 請填入您的 Apps Script Web App URL ★
  const GAS_ENDPOINT = 'https://script.google.com/macros/s/AKfycbyXoEVaT6bGjnpjQXLb2Wx9NXx2RR-p9ZNRF_0dzWCIZMXpBULaWMLam0NtItzhU2ejhA/exec';
  
  // 內建假日表
  const builtInHolidays = {
    '2025-1-1':true, '2025-1-25':true, '2025-1-26':true, '2025-1-27':true, '2025-1-28':true, '2025-1-29':true, '2025-1-30':true, '2025-1-31':true, '2025-2-1':true, '2025-2-2':true, '2025-2-28':true, '2025-4-3':true, '2025-4-4':true, '2025-4-5':true, '2025-4-6':true, '2025-5-30':true, '2025-5-31':true, '2025-6-1':true, '2025-10-4':true, '2025-10-5':true, '2025-10-6':true, '2025-10-10':true, '2025-10-11':true, '2025-10-12':true
  };

  function generateUUID() {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) { try { return crypto.randomUUID(); } catch(e) {} }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
      var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
      return v.toString(16);
    });
  }

  function toggleMobileSidebar() {
    const a = $('aside'); if (!a) return;
    a.classList.toggle('hidden'); a.classList.toggle('absolute'); a.classList.toggle('h-full');
  }

  // ★ 初始化 FullCalendar
  document.addEventListener('DOMContentLoaded', function() {
    const calendarEl = document.getElementById('calendar');
    if (calendarEl) {
        calendar = new FullCalendar.Calendar(calendarEl, {
            initialView: 'listWeek', 
            locale: 'zh-tw',
            headerToolbar: {
                left: 'prev,next today',
                center: 'title',
                right: 'listWeek,dayGridWeek,dayGridMonth' 
            },
            buttonText: {
                today: '今天',
                month: '月',
                week: '週',
                list: '清單'
            },
            eventTimeFormat: { hour: '2-digit', minute: '2-digit', hour12: false },
            
            // ★ 策略：月與週最多顯示 3 筆，超過顯示 +X 更多 (點擊浮出清單)
            dayMaxEvents: 3, 

            // ★ 自訂渲染：清單顯示詳細，格子顯示極簡
            eventContent: function(arg) {
                const ep = arg.event.extendedProps || {};
                const topic = String(ep.purpose || '').trim() || '訓練課程';
                if (arg.view.type === 'listWeek') {
                    return { html: `<div class="flex flex-col leading-tight">`
                        + `<div class="font-bold text-slate-800 flex items-center gap-1"><i class="ri-fire-fill text-orange-500"></i>${topic}</div>`
                        + `<div class="text-xs text-slate-500 mt-0.5">${ep.unit || ''} · ${arg.event.title}</div>`
                        + `</div>` };
                } else {
                    return { html: `<div class="text-[11px] px-1 leading-tight truncate"><span class="font-bold">${arg.event.title}</span><span class="opacity-75"> ${topic}</span></div>` };
                }
            },

            // ★ Tooltip 提示
            eventDidMount: function(info) {
                if (info.event.extendedProps.description) {
                    info.el.title = info.event.extendedProps.description; 
                }
            },

            // ★ 點擊跳出詳細資訊
            eventClick: function(info) {
                alert(info.event.extendedProps.description);
            },
            events:[]
        });
        calendar.render();
    }
  });

  if ($('#date')) $('#date').value = new Date().toISOString().slice(0, 10);

  const SAFETY_HIGH = "⚠️ 依內政部消防署109年9月29日消署訓字第1091700957號函頒「消防機關辦理各項救災訓練安全管理指導原則」辦理，請指派資深教官負責全盤訓練安全事宜。\n⚠️ 借用單位請於訓後將場地復原並維持場地整潔。";
  const SAFETY_LOW = "⚠️ 請借用單位訓後將場地復原並維持場地整潔。";

  const facilityEl = $('#facility');
  if (facilityEl) {
    facilityEl.addEventListener('change', (e) => {
      const val = e.target.value;
      const customInput = $('#customFacility');
      if (customInput) {
        if (val === 'other') { customInput.classList.remove('hidden'); customInput.required = true; } 
        else { customInput.classList.add('hidden'); customInput.required = false; customInput.value = ""; }
      }
      const isHigh =["燃燒櫃", "燃燒室", "空呼氣訓練場", "AB塔", "大直訓練場"].includes(val) || val === 'other';
      const safetyTextEl = $('#safetyText');
      if (safetyTextEl) safetyTextEl.innerText = isHigh ? SAFETY_HIGH : SAFETY_LOW;
    });
  }
  if ($('#safetyText')) $('#safetyText').innerText = SAFETY_LOW;

  const isAllDayEl = $('#isAllDay');
  if (isAllDayEl) {
    isAllDayEl.addEventListener('change', (e) => {
      const s = $('#startTime'), eEnd = $('#endTime');
      if (!s || !eEnd) return;
      if (e.target.checked) {
        s.value = "08:00"; eEnd.value = "17:00"; s.classList.add('disabled-input'); eEnd.classList.add('disabled-input');
      } else {
        s.classList.remove('disabled-input'); eEnd.classList.remove('disabled-input');
      }
    });
  }

  function updateApplyMode() {
    const modeInput = document.querySelector('input[name="applyMode"]:checked');
    const mode = modeInput ? modeInput.value : 'single';
    const singleContainer = $('#singleDateContainer');
    const multiWrap = $('#multiDateWrap');
    const singleDate = $('#date');
    if (!singleContainer || !multiWrap) return;
    if (mode === 'single') {
      singleContainer.classList.remove('hidden'); multiWrap.classList.add('hidden'); if (singleDate) singleDate.required = true;
    } else {
      singleContainer.classList.add('hidden'); multiWrap.classList.remove('hidden'); if (singleDate) singleDate.required = false;
    }
  }
  document.querySelectorAll('input[name="applyMode"]').forEach(r => r.addEventListener('change', updateApplyMode));
  updateApplyMode();

  // 日曆選擇器變數
  let pickerYear = new Date().getFullYear();
  let currentCalendarMonth = new Date().getMonth() + 1;
  let selectedDatesSet = new Set();
  let finalSelectedDates =[];

  function openDateModal() {
    const modal = $('#dateModal'); if(!modal) return;
    renderCalendar(); updateModalRangeText(); modal.classList.remove('hidden'); modal.classList.add('flex');
  }
  function closeDateModal() {
    const modal = $('#dateModal'); if(!modal) return; modal.classList.add('hidden'); modal.classList.remove('flex');
  }
  function changePickerYear(val) { pickerYear = parseInt(val); selectedDatesSet.clear(); renderCalendar(); updateModalRangeText(); }
  function isDayOff(year, month, day) {
    const key = `${year}-${month}-${day}`;
    if (builtInHolidays[key]) return true;
    const d = new Date(year, month - 1, day); const w = d.getDay(); return w === 0 || w === 6;
  }
  function changeMonth(delta) {
    currentCalendarMonth += delta;
    if (currentCalendarMonth < 1) { currentCalendarMonth = 12; pickerYear--; }
    if (currentCalendarMonth > 12) { currentCalendarMonth = 1; pickerYear++; }
    $('#pickerYearSelect').value = pickerYear; renderCalendar(); updateModalRangeText();
  }
  function updateModalRangeText() { $('#modalRangeText').innerText = `已選取 ${selectedDatesSet.size} 天`; }

  function renderCalendar() {
    const grid = $('#calendarGrid'); if(!grid) return; grid.innerHTML = '';
    const header = document.createElement('div'); header.className = "col-span-7 flex justify-between items-center mb-2";
    header.innerHTML = `<button type="button" onclick="changeMonth(-1)" class="px-2 py-1 bg-slate-100 rounded hover:bg-slate-200"><i class="ri-arrow-left-s-line"></i></button><span class="font-bold text-lg text-indigo-600">${currentCalendarMonth} 月</span><button type="button" onclick="changeMonth(1)" class="px-2 py-1 bg-slate-100 rounded hover:bg-slate-200"><i class="ri-arrow-right-s-line"></i></button>`;
    grid.appendChild(header);['日','一','二','三','四','五','六'].forEach(d => { const div = document.createElement('div'); div.className = "text-center text-xs font-bold text-slate-500 py-1"; div.innerText = d; grid.appendChild(div); });
    const daysInMonth = new Date(pickerYear, currentCalendarMonth, 0).getDate();
    const firstDay = new Date(pickerYear, currentCalendarMonth - 1, 1).getDay();
    for (let i = 0; i < firstDay; i++) { grid.appendChild(document.createElement('div')); }
    for (let d = 1; d <= daysInMonth; d++) {
        const key = `${pickerYear}-${currentCalendarMonth}-${d}`;
        const isActive = selectedDatesSet.has(key);
        const isHoliday = isDayOff(pickerYear, currentCalendarMonth, d);
        let extraClass = isHoliday ? (builtInHolidays[key] ? 'holiday-red' : 'weekend') : '';
        const btn = document.createElement('div');
        btn.className = `day-btn ${isActive ? 'active' : ''} ${extraClass}`;
        btn.innerText = d;
        btn.onclick = () => { if (selectedDatesSet.has(key)) selectedDatesSet.delete(key); else selectedDatesSet.add(key); renderCalendar(); updateModalRangeText(); };
        grid.appendChild(btn);
    }
  }

  function applyDateFilter(type) {
    const daysInMonth = new Date(pickerYear, currentCalendarMonth, 0).getDate();
    for (let d = 1; d <= daysInMonth; d++) {
        const key = `${pickerYear}-${currentCalendarMonth}-${d}`;
        const isHoliday = isDayOff(pickerYear, currentCalendarMonth, d);
        if (type === 'all') selectedDatesSet.add(key);
        else if (type === 'clear') selectedDatesSet.delete(key);
        else if (type === 'no-weekend') { if (!isHoliday) selectedDatesSet.add(key); else selectedDatesSet.delete(key); }
        else if (type === 'only-weekend') { if (isHoliday) selectedDatesSet.add(key); else selectedDatesSet.delete(key); }
    }
    renderCalendar(); updateModalRangeText();
  }

  function saveDateModal() {
    finalSelectedDates = Array.from(selectedDatesSet).map(s => {
        const[y, m, d] = s.split('-').map(Number);
        return `${y}-${m < 10 ? '0'+m : m}-${d < 10 ? '0'+d : d}`;
    }).sort();
    renderDateTags(); closeDateModal();
  }

  function renderDateTags() {
    const container = $('#dateTagContainer'); const msg = $('#emptyDateMsg');
    container.innerHTML = '';
    if (finalSelectedDates.length === 0) { msg.classList.remove('hidden'); }
    else { msg.classList.add('hidden'); finalSelectedDates.forEach(dateStr => { const tag = document.createElement('div'); tag.className = 'bg-indigo-50 text-indigo-700 text-xs font-bold px-2 py-1 rounded border border-indigo-200 flex items-center gap-2'; tag.innerHTML = `<span>${dateStr}</span>`; container.appendChild(tag); }); }
  }
  function addDateToList() { openDateModal(); }

  // ★ 更新 FullCalendar 內容 (馬卡龍色系)
  function updateFullCalendar() {
      if (!calendar) return;
      const events = dbData.filter(x => x.status.includes('已核准')).map(x => {
          const isClassroom = x.facility.includes('教室');
          return {
              title: x.facility, 
              start: `${x.date}T${x.startTime}:00`, 
              end: `${x.date}T${x.endTime}:00`,
              backgroundColor: isClassroom ? '#e0e7ff' : '#d1fae5', 
              borderColor: isClassroom ? '#c7d2fe' : '#a7f3d0', 
              textColor: isClassroom ? '#3730a3' : '#065f46',
              extendedProps: {
                  unit: x.unit,
                  contact: x.contact,
                  purpose: x.purpose,
                  facility: x.facility,
                  description: `【詳細資訊】\n課程主題：${x.purpose || '未填寫'}\n借用單位：${x.unit}\n聯絡人員：${x.contact}\n借用場地：${x.facility}\n借用時間：${x.startTime} - ${x.endTime}`
              }
          };
      });
      calendar.removeAllEvents();
      calendar.addEventSource(events);
  }

  // ★ 控制 Loading 動畫的函數
  function showLoading(show) {
      const overlays = document.querySelectorAll('.loading-overlay');
      overlays.forEach(el => {
          if (show) el.classList.add('active');
          else el.classList.remove('active');
      });
  }

  // === 資料處理 ===
  async function fetchData() {
    showLoading(true); // ★ 開始載入動畫
    try {
      const res = await fetch(GAS_ENDPOINT);
      dbData = await res.json();
      updateWeeklyNotice();
      renderList();
      renderTodo();
      updateFullCalendar(); 
      showToast('同步完成', '資料已更新', 'success');
    } catch (e) { 
      console.error(e); showToast('同步失敗', '無法取得最新資料', 'error'); 
    } finally {
      setTimeout(() => showLoading(false), 500); // ★ 確保畫面渲染完畢後淡出動畫 (加0.5秒延遲讓過場更滑順)
    }
  }
  $('#syncBtn').onclick = fetchData;
  fetchData();

  function getMissingParts(statusStr) {
    const missing =[];
    if (!statusStr.includes('使用前')) missing.push('前');
    if (!statusStr.includes('使用中')) missing.push('中');
    if (!statusStr.includes('歸還後')) missing.push('後');
    return missing;
  }

  // ★ 關鍵修正：檢查是否包含 "結案" 或 "免"
  function isCaseClosed(statusStr) {
      return statusStr && (statusStr.includes("結案") || statusStr.includes("免"));
  }

  function renderTodo() {
    const todoContainer = $('#todoList');
    const todoSection = $('#todoSection');
    const badge = $('#pendingBadge');
    if (!todoContainer) return;

    const today = new Date().toISOString().slice(0, 10);
    const pendingItems = dbData.filter(x => {
      if (!x.status.includes('已核准')) return false;
      if (x.date > today) return false;
      const s = x.uploadStatus || "";
      if (isCaseClosed(s)) return false;
      return !(s.includes("使用前") && s.includes("使用中") && s.includes("歸還後"));
    });

    if (pendingItems.length > 0) {
      badge.innerText = pendingItems.length; badge.classList.remove('hidden'); todoSection.classList.remove('hidden');
    } else {
      badge.classList.add('hidden'); todoSection.classList.add('hidden'); return;
    }

    todoContainer.innerHTML = pendingItems.map(item => {
      const missing = getMissingParts(item.uploadStatus || "");
      return `
        <div class="flex items-center justify-between bg-white p-2.5 rounded-lg border border-rose-100 shadow-sm">
          <div class="flex flex-col">
            <div class="text-xs font-bold text-slate-700">${item.date} ${item.facility}</div>
            <div class="text-[10px] text-rose-600 font-bold">❌ 缺：${missing.join('、')}</div>
          </div>
          <button onclick="switchView('list'); openPhotoModal('${item.id}')" class="text-xs bg-rose-600 text-white px-3 py-1.5 rounded-lg font-bold hover:bg-rose-700 shadow-md btn-alert"><i class="ri-camera-fill"></i> 上傳</button>
        </div>`;
    }).join('');
  }

  function updateWeeklyNotice() {
    const con = $('#weeklyNotice'); if (!con) return; con.innerHTML = '';
    let has = false;
    for (let i = 0; i < 7; i++) {
      const d = new Date(); d.setDate(new Date().getDate() + i);
      const ds = d.toISOString().slice(0, 10);
      const books = dbData.filter(x => x.date === ds && x.status.includes('已核准'));
      if (books.length) {
        has = true;
        con.innerHTML += `<div class="text-xs border-b border-slate-100 pb-2 last:border-0"><div class="font-bold text-indigo-600 mb-1">${ds}</div>${books.map(b => `<div class="bg-slate-50 px-2 py-1 rounded text-slate-600 mb-1 last:mb-0"><div class="flex justify-between"><span class="font-bold text-slate-700">${b.facility}</span><span>${b.startTime}-${b.endTime}</span></div><div class="text-[11px] text-orange-600 truncate">🔥 ${String(b.purpose || '').trim() || '訓練課程'}</div></div>`).join('')}</div>`;
      }
    }
    if (!has) con.innerHTML = '<div class="text-sm text-slate-400 py-4 text-center">未來 7 天無核准預約</div>';
  }

  const bookingForm = $('#bookingForm');
  if (bookingForm) {
    bookingForm.addEventListener('submit', async e => {
      e.preventDefault();
      const sTime = $('#startTime').value; const eTime = $('#endTime').value;
      if (sTime && eTime && eTime <= sTime) { alert('時間錯誤：結束時間需晚於開始時間'); return; }
      let facVal = $('#facility').value; if (facVal === 'other') facVal = $('#customFacility').value.trim();
      if (!facVal) { alert('請選擇或輸入場地'); return; }
      const btn = $('#submitBtn'); if (btn.disabled) return;
      const originalBtnText = btn.innerHTML; btn.innerHTML = '<i class="ri-loader-4-line animate-spin"></i> 處理中...'; btn.disabled = true;
      try {
        const isEdit = $('#editId').value !== "";
        const base = { unit: $('#unit').value, contact: $('#contact').value, phone: $('#phone').value, email: $('#email').value, facility: facVal, purpose: $('#purpose').value, startTime: sTime, endTime: eTime, id: isEdit ? $('#editId').value : generateUUID() };
        if (isEdit) {
          await fetch(GAS_ENDPOINT, { method: 'POST', headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ ...base, date: $('#date').value, action: 'edit' }) });
          showToast('更新成功', '已儲存變更', 'success'); resetForm(); setTimeout(fetchData, 1500);
        } else {
          const applyMode = document.querySelector('input[name="applyMode"]:checked').value;
          let dates =[];
          if (applyMode === 'single') { if (!$('#date').value) throw new Error('請填寫單日日期'); dates =[$('#date').value]; } 
          else { if (finalSelectedDates.length === 0) { alert('請至少選擇一個日期'); throw new Error('未選擇日期'); } dates = [...finalSelectedDates]; }
          await fetch(GAS_ENDPOINT, { method: 'POST', headers: { "Content-Type": "text/plain" }, body: JSON.stringify({ ...base, dates: dates, action: 'create_batch' }) });
          showToast('申請成功', `已送出 ${dates.length} 筆紀錄，待審核。`, 'success'); resetForm(); setTimeout(fetchData, 1500);
        }
      } catch (err) { console.error(err); if (err.message !== '未選擇日期') { alert('提交失敗'); showToast('提交失敗', '請稍後再試', 'error'); } } 
      finally { btn.innerHTML = originalBtnText; btn.classList.remove('bg-emerald-600'); btn.classList.add('bg-slate-900'); if ($('#editId').value) { btn.innerHTML = "<i class='ri-save-line'></i> 儲存變更"; btn.classList.add('bg-emerald-600'); } else { btn.innerHTML = "<i class='ri-send-plane-fill'></i> 提交申請"; } btn.disabled = false; }
    });
  }

  $('#photoFile').addEventListener('change', (e) => {
    const file = e.target.files[0]; if(file){ const reader = new FileReader(); reader.onload = (e2) => { $('#photoPreview').style.backgroundImage = `url(${e2.target.result})`; $('#photoPreview').classList.remove('hidden'); }; reader.readAsDataURL(file); }
  });
  window.openPhotoModal = (id) => { $('#photoTargetId').value = id; $('#photoFile').value = ''; $('#photoPreview').classList.add('hidden'); $('#progressText').classList.add('hidden'); $('#photoModal').classList.replace('hidden', 'flex'); };
  $('#photoForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const file = $('#photoFile').files[0]; if(!file) return alert('請選擇照片');
    const btn = $('#uploadBtn'); btn.innerHTML = '處理中...'; btn.disabled = true; $('#progressText').textContent = '上傳中...'; $('#progressText').classList.remove('hidden');
    try {
        const resized = await compressImage(file);
        const type = document.querySelector('input[name="photoType"]:checked').value;
        const res = await fetch(GAS_ENDPOINT, { method: 'POST', headers: {"Content-Type": "text/plain"}, body: JSON.stringify({ action: 'upload_photo', id: $('#photoTargetId').value, fileData: resized.split(',')[1], mimeType: 'image/jpeg', photoType: type }) });
        const result = await res.json();
        if(result.status === 'success') { showToast('上傳成功', '照片已存入雲端', 'success'); $('#photoModal').classList.replace('flex', 'hidden'); setTimeout(fetchData, 1500); } else alert(result.message || '上傳失敗');
    } catch(err) { alert('上傳錯誤'); } finally { btn.innerHTML = '開始上傳'; btn.disabled = false; $('#progressText').classList.add('hidden'); }
  });
  function compressImage(file) {
    return new Promise((resolve) => {
        const reader = new FileReader(); reader.readAsDataURL(file);
        reader.onload = (e) => {
            const img = new Image(); img.src = e.target.result;
            img.onload = () => {
                const canvas = document.createElement('canvas'); const ctx = canvas.getContext('2d');
                const scale = 800 / img.width; canvas.width = scale < 1 ? 800 : img.width; canvas.height = scale < 1 ? img.height * scale : img.height;
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height); resolve(canvas.toDataURL('image/jpeg', 0.6));
            };
        };
    });
  }

  window.editRecord = (id) => {
    const r = dbData.find(x => x.id === id); if(!r) return;
    $('#editId').value = r.id; $('#unit').value = r.unit; $('#contact').value = r.contact; $('#phone').value = r.phone; $('#email').value = r.email; $('#facility').value = r.facility; $('#purpose').value = r.purpose;
    $('#date').value = r.date; $('#startTime').value = r.startTime; $('#endTime').value = r.endTime;
    $('#modeSingle').checked = true; updateApplyMode();
    $('#formTitle').textContent = "編輯預約申請"; $('#submitBtn').innerHTML = "<i class='ri-save-line'></i> 儲存變更"; $('#submitBtn').classList.add('bg-emerald-600'); $('#cancelEditBtn').classList.remove('hidden'); switchView('form');
  };
  $('#cancelEditBtn').onclick = resetForm;
  function resetForm() {
    $('#bookingForm').reset(); $('#editId').value = ""; $('#date').value = new Date().toISOString().slice(0, 10);
    selectedDatesSet.clear(); finalSelectedDates =[]; renderDateTags();
    $('#formTitle').textContent = "新增預約申請"; $('#submitBtn').innerHTML = "<i class='ri-send-plane-fill'></i> 提交申請"; $('#submitBtn').classList.remove('bg-emerald-600'); $('#submitBtn').classList.add('bg-slate-900'); $('#cancelEditBtn').classList.add('hidden'); $('#modeSingle').checked = true; updateApplyMode();
  }
  window.openCancelModal = (id, isBatch) => { $('#cancelTargetId').value = id; $('#cancelType').value = isBatch ? 'batch' : 'single'; $('#verifyEmail').value = ''; $('#cancelReason').value = ''; $('#cancelModal').classList.replace('hidden', 'flex'); };
  $('#cancelForm').addEventListener('submit', async (e) => {
    e.preventDefault(); const btn = $('#confirmCancelBtn'); btn.innerHTML = '驗證中...'; btn.disabled = true;
    try {
        const res = await fetch(GAS_ENDPOINT, { method: 'POST', headers: {"Content-Type": "text/plain"}, body: JSON.stringify({ action: $('#cancelType').value === 'batch' ? 'cancel_batch' : 'cancel_request',[$('#cancelType').value === 'batch' ? 'batchId' : 'id']: $('#cancelTargetId').value, verifyEmail: $('#verifyEmail').value.trim(), reason: $('#cancelReason').value.trim() }) });
        const result = await res.json();
        if(result.status === 'success') { showToast('已送出', '取消申請已送交管理者', 'success'); $('#cancelModal').classList.replace('flex', 'hidden'); setTimeout(fetchData, 1500); } else alert(result.message || '申請失敗');
    } catch(err) { showToast('錯誤', '請稍後再試', 'error'); } finally { btn.innerHTML = '送出'; btn.disabled = false; }
  });

  // ★ 新增功能：手動結案按鈕
  window.manualClose = async (id) => {
      if(!confirm("確定要手動結案嗎？\n這將消除此預約的缺件提醒。")) return;
      try {
          const res = await fetch(GAS_ENDPOINT, { method: 'POST', headers: {"Content-Type": "text/plain"}, body: JSON.stringify({ action: 'manual_close', id: id }) });
          const result = await res.json();
          if(result.status === 'success') { showToast('已結案', '缺件提醒已消除', 'success'); setTimeout(fetchData, 1000); }
          else alert('失敗: ' + result.message);
      } catch(e) { alert('系統錯誤'); }
  };

  function renderList() {
    const container = $('#bookingListContainer'); if(!container) return; container.innerHTML = '';
    const filter = $('#searchInput').value.toLowerCase();
    const activeList = dbData.filter(x => !x.status.includes("取消") && !x.status.includes("拒絕")).filter(x => (x.unit + x.contact + x.facility).toLowerCase().includes(filter));
    const groups = {}; activeList.forEach(item => { const key = item.batchId || item.id; if(!groups[key]) groups[key] = []; groups[key].push(item); });
    const sortedKeys = Object.keys(groups).sort((a, b) => groups[a][0].date.localeCompare(groups[b][0].date));
    if(sortedKeys.length === 0) { container.innerHTML = '<div class="text-center text-slate-400 py-10">無資料</div>'; return; }
    
    const today = new Date().toISOString().slice(0, 10);
    sortedKeys.forEach(key => {
        const items = groups[key], f = items[0], isMulti = items.length > 1;
        const color = f.status.includes("核准") ? "text-emerald-600 bg-emerald-50" : (f.status.includes("撞期") ? "text-rose-600 bg-rose-50" : "text-amber-600 bg-amber-50");
        let missingPhotoInfo = '';

        if(f.status.includes("核准") && f.date <= today && items.some(i => !isCaseClosed(i.uploadStatus) && (!(i.uploadStatus||"").includes("前") || !(i.uploadStatus||"").includes("中") || !(i.uploadStatus||"").includes("後")))) {
            missingPhotoInfo = `<div class="ml-2 flex items-center gap-2"><span class="text-xs text-rose-600 font-bold">● 缺件</span></div>`;
        }
        
        const card = document.createElement('div');
        card.className = "card-root bg-white border border-slate-200 rounded-xl shadow-sm overflow-hidden mb-3";
        card.innerHTML = `
            <div class="p-4 flex items-center justify-between cursor-pointer bg-white hover:bg-gray-50" onclick="this.nextElementSibling.classList.toggle('hidden')">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center ${color} font-bold"><i class="ri-calendar-check-line"></i></div>
                    <div><div class="font-bold text-slate-800 flex items-center gap-2">${f.unit} <span class="text-xs font-normal text-slate-500">(${f.contact})</span>${missingPhotoInfo}</div>
                    <div class="text-xs text-slate-500 mt-0.5">${isMulti ? `<span class="bg-slate-100 px-1.5 py-0.5 rounded font-mono mr-1">共${items.length}天</span>` : ''}${f.date} · ${f.facility}</div></div>
                </div>
                <div class="flex items-center gap-2"><span class="text-xs font-bold px-2 py-1 rounded ${color}">${f.status.split(' ')[1]||f.status}</span>${isMulti ? `<button onclick="event.stopPropagation(); openCancelModal('${f.batchId}', true)" class="text-rose-500 hover:bg-rose-50 p-1.5 rounded text-xs border border-rose-200"><i class="ri-close-circle-line"></i> 整批取消</button>` : ''}</div>
            </div>
            <div class="details-panel hidden border-t border-slate-100 bg-slate-50 p-3 space-y-2">
                ${items.map(i => {
                    const isClosed = isCaseClosed(i.uploadStatus);
                    return `
                    <div class="flex flex-col gap-2 bg-white p-2 rounded border border-slate-200">
                        <div class="flex items-center justify-between text-sm">
                            <div class="flex items-center gap-3">
                                <span class="font-mono text-slate-600">${i.date}</span>
                                <span class="font-mono font-bold text-indigo-600">${i.startTime}-${i.endTime}</span>
                                <span class="text-slate-500 text-xs">${i.status}</span>

                            </div>
                            <div class="flex gap-2 items-center">
                                ${i.status.includes('核准') && !isClosed ? `<button onclick="window.manualClose('${i.id}')" class="text-emerald-600 hover:bg-emerald-50 p-1 rounded text-xs font-bold border border-emerald-200">✅ 結案</button>` : ''}
                                ${i.status.includes('核准') ? `<button onclick="openPhotoModal('${i.id}')" class="text-indigo-500 hover:bg-indigo-50 p-1 rounded"><i class="ri-camera-line text-lg"></i></button>` : ''}
                                <button onclick="openCancelModal('${i.id}', false)" class="text-rose-500 hover:bg-rose-50 p-1 rounded"><i class="ri-close-circle-line"></i></button>
                            </div>
                        </div>
                        ${i.folderUrl ? `<div class="text-xs flex items-center justify-between bg-slate-50 p-1 rounded"><a href="${i.folderUrl}" target="_blank" class="text-blue-500 hover:underline flex items-center gap-1"><i class="ri-folder-open-line"></i> 開啟資料夾</a></div>` : ''}
                    </div>`
                }).join('')}
            </div>`;
        container.appendChild(card);
    });
  }
  $('#searchInput').addEventListener('input', renderList);

  $('#exportCsvBtn').onclick = () => {
    if(!dbData.length) return alert('無資料');
    const csv = '\ufeff狀態,日期,開始,結束,場地,單位\n' + dbData.map(r => `${r.status},${r.date},${r.startTime},${r.endTime},"${r.facility}","${r.unit}"`).join('\n');

  function showToast(t, m, type) {
    const o = $('#toast'); $('#toastTitle').textContent = t; $('#toastMsg').textContent = m;
    $('#toastIcon').className = `text-2xl ri-${type === 'success' ? 'checkbox-circle-fill text-emerald-400' : 'error-warning-fill text-rose-400'}`;

  window.switchView = (v) => { document.querySelectorAll('[id^="view-"]').forEach(e => e.classList.add('hidden')); $('#view-'+v).classList.remove('hidden'); };

  // ==================================================================
  // ★ 🔥 一週課程輪播展示 (Showcase) — 給學員看的全螢幕看板
  // ==================================================================
  const SC_SLIDE_MS = 9000;      // 每頁停留時間
  const SC_PER_PAGE = 4;         // 單日每頁最多顯示幾堂課
  const SC_RESYNC_MS = 300000;   // 輪播中每 5 分鐘背景同步一次資料

  let scSlides = [], scIndex = 0, scWeekOffset = 0;
  let scRaf = null, scElapsed = 0, scLastTs = 0, scPaused = false;
  let scClockTimer = null, scLastSync = 0, scUsedFullscreen = false;

  const scWeekdays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
  const scEsc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const scKey = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const scIsRoom = (f) => /教室|會議|禮堂|講堂/.test(f || '');

  // 取得要展示的一週 (以日曆目前檢視的週為準，月檢視或取不到時用本週)
  function scGetWeek() {
    let start = null;
    try {
      if (calendar && calendar.view && calendar.view.activeStart) {
        const s = new Date(calendar.view.activeStart), e = new Date(calendar.view.activeEnd);
        if ((e - s) / 86400000 <= 8) start = s;   // 只有週檢視才沿用
      }
    } catch (err) { /* 忽略，改用本週 */ }
    if (!start || isNaN(start)) { start = new Date(); start.setDate(start.getDate() - start.getDay()); }
    start.setHours(0, 0, 0, 0);
    start.setDate(start.getDate() + scWeekOffset * 7);

    const todayKey = scKey(new Date());
    const days = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(start); d.setDate(start.getDate() + i);
      days.push({ date: d, key: scKey(d), dow: scWeekdays[d.getDay()], label: `${d.getMonth() + 1}月${d.getDate()}日`, isToday: scKey(d) === todayKey });
    }
    return { start, days };
  }

  // 依資料建立輪播頁面：第 1 頁為一週總覽，其後每日課表 (無課程日不佔頁)
  function scBuildSlides() {
    const { days } = scGetWeek();
    const byDate = {};
    days.forEach(d => byDate[d.key] = []);
    (dbData || []).forEach(x => {
      if (!x || !x.status || !x.status.includes('已核准')) return;
      if (byDate[x.date]) byDate[x.date].push(x);
    });
    Object.keys(byDate).forEach(k => byDate[k].sort((a, b) =>
      String(a.startTime || '').localeCompare(String(b.startTime || '')) || String(a.facility || '').localeCompare(String(b.facility || ''))));

    const total = days.reduce((n, d) => n + byDate[d.key].length, 0);
    const slides = [{ type: 'week', days, byDate, total }];
    days.forEach(d => {
      const list = byDate[d.key];
      const pages = Math.ceil(list.length / SC_PER_PAGE);
      for (let i = 0; i < list.length; i += SC_PER_PAGE) {
        slides.push({ type: 'day', day: d, items: list.slice(i, i + SC_PER_PAGE), total: list.length, page: i / SC_PER_PAGE + 1, pages });
      }
    });
    if (total === 0) slides.push({ type: 'empty', days });

    const first = days[0], last = days[6];
    const rangeEl = document.getElementById('scRange');
    if (rangeEl) rangeEl.textContent = `${first.date.getFullYear()}/${first.label} － ${last.label}　共 ${total} 堂`;
    return slides;
  }

  function scCardHtml(x) {
    const topic = String(x.purpose || '').trim() || '訓練課程';
    return `<div class="sc-card ${scIsRoom(x.facility) ? 'sc-room' : 'sc-field'}">
        <div class="sc-time">
          <span class="sc-t">${scEsc(x.startTime || '')}</span>
          <span class="sc-tbar"></span>
          <span class="sc-t sc-t-end">${scEsc(x.endTime || '')}</span>
        </div>
        <div class="sc-body">
          <div class="sc-topic">${scEsc(topic)}</div>
          <div class="sc-meta">
            <span class="sc-chip"><i class="ri-map-pin-2-fill"></i>${scEsc(x.facility || '')}</span>
            <span class="sc-chip"><i class="ri-team-fill"></i>${scEsc(x.unit || '')}</span>
          </div>
        </div>
      </div>`;
  }

  function scSlideHtml(s) {
    if (s.type === 'week') {
      const cols = s.days.map(d => {
        const list = s.byDate[d.key];
        const shown = list.slice(0, 4).map(x => `
            <div class="sc-mini ${scIsRoom(x.facility) ? 'sc-room' : 'sc-field'}">
              <div class="sc-mini-t">${scEsc(x.startTime || '')}-${scEsc(x.endTime || '')}</div>
              <div class="sc-mini-x">${scEsc(String(x.purpose || '').trim() || '訓練課程')}</div>
              <div class="sc-mini-f">${scEsc(x.facility || '')}</div>
            </div>`).join('');
        const more = list.length > 4 ? `<div class="sc-more">＋ 還有 ${list.length - 4} 堂</div>` : '';
        const body = list.length ? shown + more : '<div class="sc-rest">無排課</div>';
        return `<div class="sc-col ${d.isToday ? 'sc-col-today' : ''}">
            <div class="sc-col-h"><div class="sc-col-dow">${d.dow.replace('星期', '週')}</div><div class="sc-col-date">${d.label}</div></div>
            <div class="sc-col-b">${body}</div>
          </div>`;
      }).join('');
      return `<div class="sc-slide">
          <div class="sc-day-head">
            <div class="sc-dow">本週課程總覽</div>
            <div class="sc-date">WEEKLY TRAINING SCHEDULE</div>
            <div class="sc-count"><i class="ri-fire-fill"></i> 共 ${s.total} 堂課</div>
          </div>
          <div class="sc-week">${cols}</div>
        </div>`;
    }

    if (s.type === 'empty') {
      return `<div class="sc-slide"><div class="sc-empty">
          <i class="ri-fire-fill"></i>
          <div class="sc-empty-t">本週尚無核准課程</div>
          <div class="sc-empty-s">待命整備中 — STANDBY</div>
        </div></div>`;
    }

    const d = s.day;
    const pageTag = s.pages > 1 ? `（${s.page}/${s.pages}）` : '';
    return `<div class="sc-slide">
        <div class="sc-day-head">
          <div class="sc-dow">${d.dow}</div>
          <div class="sc-date">${d.date.getFullYear()}/${d.label}</div>
          ${d.isToday ? '<div class="sc-today">今日</div>' : ''}
          <div class="sc-count"><i class="ri-calendar-check-fill"></i> ${s.total} 堂課${pageTag}</div>
        </div>
        <div class="sc-cards ${s.items.length <= 2 ? 'sc-one' : ''}">${s.items.map(scCardHtml).join('')}</div>
      </div>`;
  }

  function scRender() {
    const stage = document.getElementById('scStage');
    if (!stage || !scSlides.length) return;
    if (scIndex >= scSlides.length) scIndex = 0;
    if (scIndex < 0) scIndex = scSlides.length - 1;
    stage.innerHTML = scSlideHtml(scSlides[scIndex]);

    const dots = document.getElementById('scDots');
    if (dots) {
      dots.innerHTML = scSlides.map((_, i) => `<div class="sc-dot ${i === scIndex ? 'sc-on' : ''}" data-i="${i}"></div>`).join('');
    }
  }

  function scGo(step) {
    const next = scIndex + step;
    scIndex = (next + scSlides.length) % scSlides.length;
    scElapsed = 0;
    scRender();
    if (scIndex === 0) scMaybeResync();   // 每輪播完一圈，順便背景更新資料
  }

  function scJump(i) { scIndex = i; scElapsed = 0; scRender(); }

  function scSetWeek(offset) {
    scWeekOffset = offset;
    scSlides = scBuildSlides();
    scIndex = 0; scElapsed = 0;
    scRender();
  }

  async function scMaybeResync() {
    if (Date.now() - scLastSync < SC_RESYNC_MS) return;
    scLastSync = Date.now();
    try {
      const res = await fetch(GAS_ENDPOINT);
      const data = await res.json();
      if (Array.isArray(data) && data.length) {
        dbData = data;
        updateFullCalendar();
        const keep = scIndex;
        scSlides = scBuildSlides();
        scIndex = Math.min(keep, scSlides.length - 1);
        scRender();
      }
    } catch (e) { console.warn('輪播背景同步失敗', e); }
  }

  function scLoop(ts) {
    const ov = document.getElementById('showcaseOverlay');
    if (!ov || !ov.classList.contains('sc-open')) { scRaf = null; return; }
    if (!scLastTs) scLastTs = ts;
    const dt = ts - scLastTs; scLastTs = ts;
    if (!scPaused) scElapsed += dt;
    const bar = document.getElementById('scBar');
    const p = Math.min(1, scElapsed / SC_SLIDE_MS);
    if (bar) bar.style.width = (p * 100) + '%';
    if (p >= 1) scGo(1);
    scRaf = requestAnimationFrame(scLoop);
  }

  function scTogglePlay(force) {
    scPaused = (typeof force === 'boolean') ? force : !scPaused;
    const icon = document.getElementById('scPlayIcon'), text = document.getElementById('scPlayText');
    if (icon) icon.className = scPaused ? 'ri-play-fill' : 'ri-pause-fill';
    if (text) text.textContent = scPaused ? '播放' : '暫停';
  }

  function scTickClock() {
    const now = new Date();
    const t = document.getElementById('scClockTime'), d = document.getElementById('scClockDate');
    if (t) t.textContent = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
    if (d) d.textContent = `${now.getFullYear()}/${now.getMonth() + 1}/${now.getDate()} ${scWeekdays[now.getDay()]}`;
  }

  function scOnKey(e) {
    if (e.key === 'ArrowRight') { e.preventDefault(); scGo(1); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); scGo(-1); }
    else if (e.key === ' ') { e.preventDefault(); scTogglePlay(); }
    else if (e.key === 'Escape') { scCloseShowcase(); }
  }

  function scOpenShowcase() {
    const ov = document.getElementById('showcaseOverlay');
    if (!ov) return;
    scWeekOffset = 0; scIndex = 0; scElapsed = 0; scLastTs = 0; scLastSync = Date.now();
    scSlides = scBuildSlides();
    scTogglePlay(false);
    ov.classList.add('sc-open');
    ov.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
    scRender();
    scTickClock();
    if (scClockTimer) clearInterval(scClockTimer);
    scClockTimer = setInterval(scTickClock, 1000);
    document.addEventListener('keydown', scOnKey);
    // 要求全螢幕 (不等待結果：部分環境不會回應 Promise，避免卡住輪播)
    scUsedFullscreen = false;
    try {
      if (ov.requestFullscreen) {
        const req = ov.requestFullscreen();
        if (req && typeof req.then === 'function') req.then(() => { scUsedFullscreen = true; }).catch(() => { /* 被擋下時仍以滿版顯示 */ });
        else scUsedFullscreen = true;
      } else if (ov.webkitRequestFullscreen) { ov.webkitRequestFullscreen(); scUsedFullscreen = true; }
    } catch (err) { /* 瀏覽器擋下全螢幕時，仍以滿版顯示 */ }
    if (!scRaf) { scLastTs = 0; scRaf = requestAnimationFrame(scLoop); }
    // 資料還沒回來就被點開時，立即補抓一次，避免看板空白
    if (!Array.isArray(dbData) || !dbData.length) { scLastSync = 0; scMaybeResync(); }
  }

  function scCloseShowcase() {
    const ov = document.getElementById('showcaseOverlay');
    if (!ov || !ov.classList.contains('sc-open')) return;
    ov.classList.remove('sc-open');
    ov.setAttribute('aria-hidden', 'true');
    document.body.style.overflow = '';
    document.removeEventListener('keydown', scOnKey);
    if (scRaf) { cancelAnimationFrame(scRaf); scRaf = null; }
    if (scClockTimer) { clearInterval(scClockTimer); scClockTimer = null; }
    scLastTs = 0; scElapsed = 0;
    try { if (document.fullscreenElement) document.exitFullscreen(); } catch (err) { /* ignore */ }
  }

  document.addEventListener('fullscreenchange', () => {
    const ov = document.getElementById('showcaseOverlay');
    if (!ov) return;
    // 使用者按 Esc 退出全螢幕時，一併關閉展示層
    if (scUsedFullscreen && !document.fullscreenElement && ov.classList.contains('sc-open')) scCloseShowcase();
  });

  (function scBindControls() {
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    on('showcaseBtn', scOpenShowcase);
    on('scClose', scCloseShowcase);
    on('scPrev', () => scGo(-1));
    on('scNext', () => scGo(1));
    on('scPlay', () => scTogglePlay());
    on('scPrevWeek', () => scSetWeek(scWeekOffset - 1));
    on('scNextWeek', () => scSetWeek(scWeekOffset + 1));
    const dots = document.getElementById('scDots');
    if (dots) dots.addEventListener('click', e => {
      const dot = e.target.closest('.sc-dot');
      if (dot) scJump(parseInt(dot.dataset.i, 10));
    });
  })();
</script>
</body>
</html>
